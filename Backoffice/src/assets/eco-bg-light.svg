<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fff4"/>
      <stop offset="0.5" stop-color="#e6f7ee"/>
      <stop offset="1" stop-color="#eaf7ef"/>
    </linearGradient>

    <radialGradient id="sun" cx="22%" cy="18%" r="70%">
      <stop offset="0" stop-color="#bbf7d0" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#bbf7d0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bbf7d0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="dew" cx="78%" cy="22%" r="65%">
      <stop offset="0" stop-color="#99f6e4" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#99f6e4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#99f6e4" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#mist)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <rect width="1600" height="900" fill="url(#dew)"/>

  <!-- soft hills -->
  <g opacity="0.35" filter="url(#blur)">
    <path d="M-60 720 C 260 600, 520 610, 820 735 C 1120 860, 1360 850, 1700 700 L 1700 980 L -60 980 Z"
          fill="#bbf7d0"/>
    <path d="M-60 790 C 280 680, 560 700, 860 820 C 1160 940, 1400 920, 1700 780 L 1700 980 L -60 980 Z"
          fill="#86efac"/>
  </g>

  <!-- leaves / petals -->
  <g fill="url(#leaf)" opacity="0.9">
    <path d="M220 180 C 290 120, 360 140, 372 212 C 386 296, 294 320, 244 270 C 206 232, 196 202, 220 180 Z"/>
    <path d="M520 120 C 590 72, 650 98, 660 160 C 672 232, 598 254, 548 216 C 512 188, 498 144, 520 120 Z"/>
    <path d="M1320 160 C 1390 110, 1460 126, 1472 198 C 1486 282, 1398 304, 1348 262 C 1310 230, 1296 186, 1320 160 Z"/>
    <path d="M1220 360 C 1290 300, 1360 320, 1372 392 C 1386 476, 1294 500, 1244 450 C 1206 412, 1196 382, 1220 360 Z"/>
    <path d="M260 430 C 330 370, 402 392, 412 460 C 424 540, 336 566, 284 520 C 250 490, 238 456, 260 430 Z"/>
    <path d="M760 260 C 830 206, 900 232, 908 300 C 916 374, 844 396, 794 360 C 758 334, 742 292, 760 260 Z"/>
  </g>
</svg>

