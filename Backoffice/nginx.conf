## NOTE:
## This file is copied to /etc/nginx/conf.d/default.conf (see Backoffice/Dockerfile),
## which is included from nginx.conf inside the `http {}` context.
## Therefore directives like `map` / `upstream` must be declared at top-level
## (http-context), NOT inside `server {}`.

# Detect social bots (VK + common crawlers) to serve OG HTML from backend
map $http_user_agent $is_social_bot {
    default 0;
    ~*vkshare 1;
    ~*vkbot 1;
    ~*facebookexternalhit 1;
    ~*twitterbot 1;
    ~*telegrambot 1;
    ~*whatsapp 1;
    ~*okhttp 1;
}

# Go backend (adjust if your API runs elsewhere)
upstream greenwarden_api {
    # IMPORTANT: 127.0.0.1 points to the same container.
    # In production, set this to your API container/service DNS name on the same docker network.
    server 127.0.0.1:8090;
}

server {
    listen 3000;  # Слушаем порт 3000
    server_name localhost;

    # For share links: bots -> Go HTML with OG tags, humans -> SPA
    location ~ ^/violations/ {
        if ($is_social_bot) {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass http://greenwarden_api;
            break;
        }

        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

