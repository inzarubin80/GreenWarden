## NOTE:
## This file is copied to /etc/nginx/conf.d/default.conf (see Backoffice/Dockerfile),
## which is included from nginx.conf inside the `http {}` context.
## Therefore directives like `upstream` must be declared at top-level (http-context),
## NOT inside `server {}`.

# Go backend (adjust if your API runs elsewhere)
upstream greenwarden_api {
    # Backoffice runs in its own container, so 127.0.0.1 is NOT the Go API.
    # Use the public API domain (or an internal service DNS name if you have one).
    server api.green-warden.ru:443;
}

server {
    listen 3000;  # Слушаем порт 3000
    server_name localhost;

    # Public share links: ALWAYS server-rendered HTML from API (OG + readable page)
    location ^~ /violations/ {
        proxy_ssl_server_name on;

        # Send request to API vhost, but preserve original public host for canonical/og:url building.
        proxy_set_header Host api.green-warden.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass https://greenwarden_api;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

